plugins {
    id 'com.android.application'
}

// Clave de subida para Google Play (ver keystore.properties en la raíz del proyecto).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.avd.time'
    compileSdk 36

    defaultConfig {
        applicationId 'com.avd.time'
        minSdk 26
        targetSdk 36
        // La versión sube sola con cada compilación de GitHub (número de ejecución).
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode build
        versionName "1.0.${build}"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

base {
    archivesName = 'AVD-time'
}
