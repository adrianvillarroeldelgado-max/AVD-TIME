name: Compilar AVD time

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar AAB (Google Play) y APK
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Subir AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: AVD-time-google-play-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Subir APK para instalar directo
        uses: actions/upload-artifact@v4
        with:
          name: AVD-time-apk
          path: app/build/outputs/apk/release/*.apk
