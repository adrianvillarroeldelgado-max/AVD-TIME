name: Compilar AVD time

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar AAB (Google Play) y APK
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Subir AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: AVD-time-google-play-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Subir APK para instalar directo
        uses: actions/upload-artifact@v4
        with:
          name: AVD-time-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar descarga del APK
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/*.apk AVD-time.apk
          TAG="v1.0-${{ github.run_number }}"
          gh release create "$TAG" AVD-time.apk --title "AVD time (compilación ${{ github.run_number }})" --notes "Descarga AVD-time.apk en tu teléfono Android y ábrelo para instalarlo." --latest
        env:
          GH_TOKEN: ${{ github.token }}
