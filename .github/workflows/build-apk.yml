name: Compilar APK (prueba)

# En cada cambio de una rama distinta de main: compila y deja el APK como artefacto descargable.
# (Los cambios en main ya generan la versión publicada con "Publicar versión".)
on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (ya instalado en el servidor)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Preparar firma (si hay secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Versión de prueba
        run: |
          # Mismo código que una publicación: así el APK de prueba se instala encima de la versión actual.
          echo "VERSION_CODE=$(( ($(git log -1 --format=%ct) - 1704067200) / 60 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION | cut -d. -f1-2)-prueba-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log; then
            msg=$(grep -E "What went wrong|^> |error:|Could not|FAILED" gradle.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Error de compilación::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AVD-time-apk
          path: app/build/outputs/apk/github/release/*.apk
